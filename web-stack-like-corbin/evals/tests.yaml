- description: "Web stack: combine TanStack Start, Hono, PostgreSQL, and Drizzle for a new SSR app"
  metadata:
    skill: web-stack-like-corbin
    kind: behavior
    behaviorId: default-ssr-stack
    caseId: web-stack-like-corbin/default-ssr-stack
  vars:
    skill: web-stack-like-corbin
    kind: behavior
    request: Set up a new SSR web app with a database.
    context: ""
    skillSource: file://web-stack-like-corbin/SKILL.md
    reference: file://web-stack-like-corbin/references/compatibility.md
    reference1: file://web-stack-like-corbin/references/stack.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Uses TanStack Start for the SSR app and a separate Hono backend in a pnpm monorepo
        - Uses PostgreSQL with Drizzle v1 RC
        - Consults references/stack.md before selecting tools, or reflects its choices
        - Must NOT: Adds Tailwind
        - Must NOT: Installs tools with no present requirement
        - Must NOT: Deploys anything
