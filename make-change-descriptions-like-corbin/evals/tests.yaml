- description: "Change description routing: select for drafting a PR body from a diff"
  metadata:
    skill: make-change-descriptions-like-corbin
    kind: trigger
    caseId: make-change-descriptions-like-corbin/trigger-pr-body
  providers: [candidate]
  vars:
    skill: make-change-descriptions-like-corbin
    kind: trigger
    request: Write the pull request description for this diff in Corbin's style.
    context: ""
    shouldLoad: true
  assert: &routing
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required: [skills]
        properties:
          skills:
            type: array
            uniqueItems: true
            items:
              type: string
              enum:
                - architect-like-corbin
                - choose-libraries-like-corbin
                - docs-like-corbin
                - fetch-data-like-corbin
                - git-like-corbin
                - maintain-like-corbin
                - make-change-descriptions-like-corbin
                - modularize-prs-like-corbin
                - perf-like-corbin
                - rethink-code-like-corbin
                - scaffold-like-corbin
                - test-like-corbin
                - ui-like-corbin
                - web-stack-like-corbin
                - write-like-corbin
    - type: javascript
      value: JSON.parse(output).skills.includes(context.vars.skill) === context.vars.shouldLoad
