- description: "Writing: teach Strict Mode effect cleanup with an accurate example and practical takeaway"
  metadata:
    skill: write-like-corbin
    kind: behavior
    behaviorId: tutorial-shape
    caseId: write-like-corbin/tutorial-shape
  vars:
    skill: write-like-corbin
    kind: behavior
    request: Write a short tutorial on why useEffect runs twice in React Strict Mode.
    context: A current React app has <StrictMode> around the root. The reader sees an Effect run again
      on initial mount in a development build.
    skillSource: file://write-like-corbin/SKILL.md
    reference: file://write-like-corbin/references/formats.md
    reference1: file://write-like-corbin/references/topic-and-series-architecture.md
    reference2: file://write-like-corbin/references/voice-and-style.md
  assert:
    - type: llm-rubric
      value: >-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.


        - Opens with a concrete problem or scenario the reader can feel

        - Uses a simple example to explain the mechanism behind its recommendation; a brief answer or
        overview before the example is acceptable

        - Names a tradeoff or limit of the claim

        - Uses a conversational, collaborative register that guides and directly addresses the reader

        - Ends with a practical takeaway

        - Explains that root Strict Mode runs setup, cleanup, then setup again on initial mount in
        development to reveal missing or incorrect cleanup; this extra check does not run in
        production

        - Shows a technically correct example where cleanup undoes setup and recommends fixing
        cleanup rather than suppressing the check

        - Must NOT: Invents a personal anecdote attributed to Corbin

        - Must NOT: Overuses emojis or exclamation points

        - Must NOT: Opens with generic throat-clearing such as 'In today's fast-paced world'
