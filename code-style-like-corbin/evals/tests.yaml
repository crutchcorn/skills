- description: "Code style routing: select when implementing an async function"
  metadata:
    skill: code-style-like-corbin
    kind: trigger
    caseId: code-style-like-corbin/trigger-implementation
  providers:
    - candidate
  vars:
    skill: code-style-like-corbin
    kind: trigger
    request: Implement a function that loads records and returns a collection of their names.
    context: ""
    shouldLoad: true
  assert: &routing
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required:
          - skills
        properties:
          skills:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              enum:
                - architect-like-corbin
                - choose-libraries-like-corbin
                - code-style-like-corbin
                - docs-like-corbin
                - fetch-data-like-corbin
                - git-like-corbin
                - maintain-like-corbin
                - make-change-descriptions-like-corbin
                - modularize-prs-like-corbin
                - perf-like-corbin
                - rethink-code-like-corbin
                - scaffold-like-corbin
                - test-like-corbin
                - ui-like-corbin
                - web-stack-like-corbin
                - write-like-corbin
    - type: javascript
      value: JSON.parse(output).skills.includes(context.vars.skill) === context.vars.shouldLoad
