- description: "Modularize PRs routing: select for an explicit dollar invocation"
  metadata:
    skill: modularize-prs-like-corbin
    kind: trigger
    caseId: modularize-prs-like-corbin/trigger-explicit-dollar
  providers:
    - candidate
  vars:
    skill: modularize-prs-like-corbin
    kind: trigger
    request: Use $modularize-prs-like-corbin to split all my work into separate PR branches.
    context: ""
    shouldLoad: true
  assert: &routing
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required:
          - skills
        properties:
          skills:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              enum:
                - architect-like-corbin
                - choose-libraries-like-corbin
                - docs-like-corbin
                - git-like-corbin
                - maintain-like-corbin
                - modularize-prs-like-corbin
                - perf-like-corbin
                - rethink-code-like-corbin
                - scaffold-like-corbin
                - test-like-corbin
                - ui-like-corbin
                - web-stack-like-corbin
                - write-like-corbin
    - type: javascript
      value: JSON.parse(output).skills.includes(context.vars.skill) === context.vars.shouldLoad
- description: "Modularize PRs routing: select when the user asks for the skill by display name"
  metadata:
