- description: "Web stack: add a Vue-compatible date picker without migrating the application"
  metadata:
    skill: web-stack-like-corbin
    kind: behavior
    behaviorId: respect-existing-vue-stack
    caseId: web-stack-like-corbin/respect-existing-vue-stack
  vars:
    skill: web-stack-like-corbin
    kind: behavior
    request: Add a date picker to the booking page.
    context: An existing Vue 3 + Vite app using Pinia and Vue Router.
    skillSource: file://web-stack-like-corbin/SKILL.md
    reference: file://web-stack-like-corbin/references/compatibility.md
    reference1: file://web-stack-like-corbin/references/stack.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Keeps Vue and the existing stack
        - Chooses a Vue-compatible solution
        - Must NOT: Suggests migrating to React or TanStack Router
        - Must NOT: Replaces Pinia with TanStack Query
