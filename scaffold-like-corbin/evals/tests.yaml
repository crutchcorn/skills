- description: "Scaffolding: create only the needed TanStack Start and Hono apps in a pnpm workspace"
  metadata:
    skill: scaffold-like-corbin
    kind: behavior
    behaviorId: smallest-useful-monorepo
    caseId: scaffold-like-corbin/smallest-useful-monorepo
  vars:
    skill: scaffold-like-corbin
    kind: behavior
    request: "Scaffold a new project: a React app with SSR and a substantial backend API. No marketing
      site yet."
    context: ""
    skillSource: file://scaffold-like-corbin/SKILL.md
    reference: file://scaffold-like-corbin/references/workspace-ci-and-releases.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Creates a pnpm monorepo with separate TanStack Start and Hono apps
        - Creates only the apps and packages needed now
        - Exposes root-level development and verification commands
        - Keeps Node and pnpm versions in one authoritative declaration
        - Must NOT: Adds placeholder packages such as an empty UI library with no consumer
        - Must NOT: Deploys or creates remote infrastructure
        - Must NOT: Adds Nx or Turborepo without a stated coordination need
- description: "Scaffolding: run local check commands in CI and make security findings fail"
  metadata:
    skill: scaffold-like-corbin
    kind: behavior
    behaviorId: ci-matches-local
    caseId: scaffold-like-corbin/ci-matches-local
  vars:
    skill: scaffold-like-corbin
    kind: behavior
    request: Add a GitHub Actions workflow that runs our checks.
    context: "The repo has root scripts: `lint`, `typecheck`, `test`, `build`. Node and pnpm versions
      are declared in `package.json` `engines` and `packageManager`."
    skillSource: file://scaffold-like-corbin/SKILL.md
    reference: file://scaffold-like-corbin/references/workspace-ci-and-releases.md
  assert:
    - type: llm-rubric
      value: >-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.


        - Calls the same root commands developers run locally

        - Lets failures propagate with a non-zero exit

        - Derives Node and pnpm versions from the existing declarations instead of pinning
        separately

        - Lints the workflow with Zizmor configured so findings fail the check

        - Must NOT: Uses continue-on-error or similar to make the pipeline pass

        - Must NOT: Uploads Zizmor SARIF alone and treats that as the gate
- description: "Scaffolding: configure Changesets and npm Trusted Publishing without publishing a package"
  metadata:
    skill: scaffold-like-corbin
    kind: behavior
    behaviorId: trusted-publishing
    caseId: scaffold-like-corbin/trusted-publishing
  vars:
    skill: scaffold-like-corbin
    kind: behavior
    request: Set up npm publishing.
    context: "`packages/*` contains two public libraries. No release tooling exists."
    skillSource: file://scaffold-like-corbin/SKILL.md
    reference: file://scaffold-like-corbin/references/workspace-ci-and-releases.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Uses Changesets for versioning and release notes
        - Uses npm Trusted Publishing with GitHub OIDC and grants id-token: write to the publish job
        - Identifies the actual publisher used for npm Trusted Publishing and makes activation conditional on current official runtime, runner, and publisher compatibility checks. In this tools-unavailable evaluation, concrete prerequisite instructions such as checking "npm Trusted Publishing runner and CLI requirements" satisfy this; no live lookup or separate re-enumeration of Node and the already identified publish command is required. Does not assume pnpm or Changesets provides OIDC support merely because it manages the workspace, or claim checks were performed when they were not.
        - Must NOT: Introduces a long-lived NPM_TOKEN as the publish mechanism
        - Must NOT: Publishes a package to test the setup
