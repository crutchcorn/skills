  vars:
    skill: test-like-corbin
    kind: behavior
    request: When saving a profile fails, the form loses everything I typed. Cover this with a test.
    context: React app using Vitest Browser Mode with Playwright and MSW. The profile form calls `PUT
      /api/profile`.
    skillSource: file://test-like-corbin/SKILL.md
    reference: file://test-like-corbin/references/test-decisions.md
  assert:
    - type: llm-rubric
      value: file://test-like-corbin/evals/rubrics/browser-integration-regression.txt
- description: "Testing: use existing checks and inspection for a cosmetic CSS change"
  metadata:
    skill: test-like-corbin
    kind: behavior
    behaviorId: no-test-for-cosmetic-change
    caseId: test-like-corbin/no-test-for-cosmetic-change
  vars:
    skill: test-like-corbin
    kind: behavior
    request: I renamed a CSS class and adjusted the heading spacing. What tests should I add?
    context: ""
    skillSource: file://test-like-corbin/SKILL.md
    reference: file://test-like-corbin/references/test-decisions.md
  assert:
    - type: llm-rubric
      value: >-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.


        - Explains that no new test is warranted and recommends running existing checks and
        inspecting the result

        - Must NOT: Adds DOM snapshot or screenshot tests
- description: "Testing: verify duplicate registrations through real PostgreSQL queries"
  metadata:
    skill: test-like-corbin
    kind: behavior
    behaviorId: real-database-boundary
    caseId: test-like-corbin/real-database-boundary
  vars:
    skill: test-like-corbin
    kind: behavior
    request: Add a test that duplicate registrations are rejected.
    context: Hono API with Drizzle and PostgreSQL. The `users.email` column has a unique constraint.
    skillSource: file://test-like-corbin/SKILL.md
    reference: file://test-like-corbin/references/test-decisions.md
  assert:
    - type: llm-rubric
      value: >-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.


        - Uses a disposable real PostgreSQL database with real queries

        - Exercises the application operation and asserts the duplicate is rejected in the intended
        way

        - Must NOT: Mocks the repository or ORM to return a duplicate error
- description: "Testing: set up Vitest Browser Mode with Playwright for a new frontend"
  metadata:
    skill: test-like-corbin
    kind: behavior
    behaviorId: preferred-setup-for-new-app
    caseId: test-like-corbin/preferred-setup-for-new-app
  vars:
    skill: test-like-corbin
    kind: behavior
    request: Set up frontend testing.
    context: A new React app with no test setup.
    skillSource: file://test-like-corbin/SKILL.md
    reference: file://test-like-corbin/references/test-decisions.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Uses Vitest Browser Mode with Playwright
        - Requires checking current official documentation and package versions before applying version-sensitive configuration. In this tools-unavailable evaluation, a concrete plan or instructions making that check a prerequisite satisfy the requirement; any example must be identified as unverified. Do not require an actual documentation fetch or first-person wording. An optional check only if configuration fails or versions differ is insufficient.
        - Must NOT: Writes tests for every component just because the runner is now configured
- description: "Testing: add date parser coverage with the existing Jest runner"
  metadata:
