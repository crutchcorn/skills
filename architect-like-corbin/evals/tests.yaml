- description: "Architecture: add Stripe through the existing webhook registry"
  metadata:
    skill: architect-like-corbin
    kind: behavior
    behaviorId: reuse-existing-extension-point
    caseId: architect-like-corbin/reuse-existing-extension-point
  vars:
    skill: architect-like-corbin
    kind: behavior
    request: Add a Stripe webhook handler.
    context: The repo has `src/webhooks/github.ts`, registered through `src/webhooks/registry.ts`, which
      maps a provider name to a handler and verifies signatures.
    skillSource: file://architect-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: >-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.


        - Registers the Stripe handler through the existing registry rather than adding a parallel
        mechanism

        - Keeps the change scoped to the Stripe handler and its registration

        - Names the existing mechanism being reused when explaining the change

        - Must NOT: Proposes a generic webhook framework or provider abstraction for future
        integrations

        - Must NOT: Refactors the GitHub handler or registry beyond what Stripe requires
