- description: "Rethink routing: select for repeated architectural review failures"
  metadata:
    skill: rethink-code-like-corbin
    kind: trigger
    caseId: rethink-code-like-corbin/trigger-review-churn
  providers:
    - candidate
  vars:
    skill: rethink-code-like-corbin
    kind: trigger
    request: This implementation has failed three rounds of architectural review. Each fix creates another problem. Reconsider it from its purpose and build a fresh version.
    context: ""
    shouldLoad: true
  assert: &routing
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required:
          - skills
        properties:
          skills:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              enum:
                - architect-like-corbin
                - choose-libraries-like-corbin
                - docs-like-corbin
                - git-like-corbin
                - maintain-like-corbin
                - modularize-prs-like-corbin
                - perf-like-corbin
                - rethink-code-like-corbin
                - scaffold-like-corbin
                - test-like-corbin
                - ui-like-corbin
                - web-stack-like-corbin
                - write-like-corbin
    - type: javascript
      value: JSON.parse(output).skills.includes(context.vars.skill) === context.vars.shouldLoad
- description: "Rethink routing: select for repeated rewrites caused by the current design"
  metadata:
    skill: rethink-code-like-corbin
