- description: "Docs routing: select for rewriting a README to help new users start"
  metadata:
    skill: docs-like-corbin
    kind: trigger
    caseId: docs-like-corbin/trigger-positive-1
  providers:
    - candidate
  vars:
    skill: docs-like-corbin
    kind: trigger
    request: Rewrite the README so new users can actually get started.
    context: ""
    shouldLoad: true
  assert: &a1
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required:
          - skills
        properties:
          skills:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              enum:
                - architect-like-corbin
                - choose-libraries-like-corbin
                - docs-like-corbin
                - git-like-corbin
                - maintain-like-corbin
                - perf-like-corbin
                - rethink-code-like-corbin
                - scaffold-like-corbin
                - test-like-corbin
                - ui-like-corbin
                - web-stack-like-corbin
                - write-like-corbin
    - type: javascript
      value: JSON.parse(output).skills.includes(context.vars.skill) === context.vars.shouldLoad
