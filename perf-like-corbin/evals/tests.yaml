- description: "Performance: measure the reports page before and after changes under representative conditions"
  metadata:
    skill: perf-like-corbin
    kind: behavior
    behaviorId: measure-before-and-after
    caseId: perf-like-corbin/measure-before-and-after
  vars:
    skill: perf-like-corbin
    kind: behavior
    request: Speed up the reports page.
    context: A TanStack Start app. The `/reports` route feels slow in production. The project already
      has Lighthouse CI configured.
    skillSource: file://perf-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: >-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.


        This is a tools-unavailable planning evaluation. Require a concrete measurement and
        reporting plan, not measurements the assistant cannot obtain.


        - Commits to measuring a baseline with the existing tooling before changing code

        - Plans to measure production output or representative conditions rather than a dev build

        - Defines a before/after comparison with the metrics, equivalent tested conditions, and how
        uncertainty or normal variability will be accounted for. This evidence may appear across
        the measurement and verification plan; a separate reporting section or literal promise to
        report is not required

        - Distinguishes planned measurements from results actually available

        - Must NOT: Claims a speedup without measurement

        - Must NOT: Removes a visual or feature to improve the metric without explaining the
        tradeoff
- description: "Performance: load Monaco only on the editor route and check both loading paths"
  metadata:
    skill: perf-like-corbin
    kind: behavior
    behaviorId: route-specific-loading
    caseId: perf-like-corbin/route-specific-loading
  vars:
    skill: perf-like-corbin
    kind: behavior
    request: Fix the bundle so only the editor page pays for Monaco.
    context: "`monaco-editor` is imported from a shared layout component, so every route ships it. Only
      `/editor` uses it."
    skillSource: file://perf-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Uses the framework's route loading or code-splitting mechanism
        - Checks both the editor page and an unrelated page afterward
        - Accounts for the cost of deferred loading on the editor interaction itself
        - Must NOT: Adds a benchmark framework when existing tooling suffices
- description: "Performance: remove theme switching jank with CSS custom properties"
  metadata:
    skill: perf-like-corbin
    kind: behavior
    behaviorId: css-over-js-sync
    caseId: perf-like-corbin/css-over-js-sync
  vars:
    skill: perf-like-corbin
    kind: behavior
    request: Fix the jank.
    context: The theme switcher runs a `useEffect` that loops over about forty elements and sets inline
      `style.backgroundColor` and `style.color` on each when the theme changes. Users report jank
      when switching.
    skillSource: file://perf-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Moves theme values to CSS custom properties and the cascade
        - Keeps JavaScript responsible only for the user's preference and its persistence
        - Verifies the switch is still visually correct afterward
        - Must NOT: Removes the theme switcher or reduces its functionality
