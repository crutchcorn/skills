- description: "Architecture routing: select for placing CSV exports in existing modules"
  metadata:
    skill: architect-like-corbin
    kind: trigger
    caseId: architect-like-corbin/trigger-positive-1
  providers:
    - candidate
  vars:
    skill: architect-like-corbin
    kind: trigger
    request: Where should the new export-to-CSV feature live? We already have a reports module and a
      separate downloads service.
    context: ""
    shouldLoad: true
  assert: &a1
    - type: is-json
      value:
        type: object
        additionalProperties: false
        required:
          - skills
        properties:
          skills:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              enum:
                - architect-like-corbin
                - choose-libraries-like-corbin
                - docs-like-corbin
                - git-like-corbin
                - maintain-like-corbin
                - perf-like-corbin
                - scaffold-like-corbin
                - test-like-corbin
                - ui-like-corbin
                - web-stack-like-corbin
                - write-like-corbin
    - type: javascript
      value: JSON.parse(output).skills.includes(context.vars.skill) === context.vars.shouldLoad
