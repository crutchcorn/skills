- description: "Code style: name loaded and mapped values in a new implementation"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: named-computed-arguments
    caseId: code-style-like-corbin/named-computed-arguments
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Implement `async function buildNames()`. Return only the code.
    context: |-
      Existing APIs are `loadRecords(): Promise<Array<{ name: string }>>`,
      `normalizeRecords(records): Array<{ name: string }>`, and
      `new NameCollection(names: string[])`. Load the records, normalize them,
      and return a NameCollection containing the normalized records' names.
    skillSource: file://code-style-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent names and valid code.

        - Implements the requested asynchronous function using the supplied APIs, in order.
        - Awaits loadRecords into a named value before passing it to normalizeRecords.
        - Stores normalized records in a named value and maps their name fields into another
          named value before passing those names to the NameCollection constructor.
        - Does not change the supplied APIs, add dependencies, or merely explain a proposed implementation.
- description: "Code style: preserve argument order and method receiver when extracting an await"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: preserve-evaluation-order
    caseId: code-style-like-corbin/preserve-evaluation-order
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Make this function easier to read using named intermediate values. Return the revised code.
    context: |-
      async function recordNext() {
        return recorder.record(nextId(), await load());
      }
      nextId increments a counter that load reads. recorder.record uses `this`.
      recorder and its record method are stable throughout this function.
    skillSource: file://code-style-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent names and valid code.

        - Provides revised code with named values for both nextId() and the awaited load().
        - Calls nextId exactly once before invoking load, and awaits load exactly once before recording.
        - Preserves recorder as the receiver of record and returns the recording result.
        - Does not introduce concurrent evaluation or unrelated changes.
- description: "Code style: retain conditional loading and leave simple arguments inline"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: preserve-conditional-execution
    caseId: code-style-like-corbin/preserve-conditional-execution
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Improve the readability of the nested calls without changing behavior. Return the revised code.
    context: |-
      async function maybeSave(enabled) {
        log("save", enabled);
        return enabled ? save(await load()) : undefined;
      }
      log, load, and save are stable functions. load and save have side effects.
    skillSource: file://code-style-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent names and valid code.

        - Provides revised code that names the awaited load result before passing it to save.
        - Calls load and save only when enabled is truthy; preserves the false branch's undefined result.
        - Calls log first with the same literal and enabled value, leaving these simple arguments inline.
        - Preserves the save result as the function result when enabled and does not swallow errors.
- description: "Code style: use early exits and a local result without mutating inputs"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: early-exits-and-local-accumulation
    caseId: code-style-like-corbin/early-exits-and-local-accumulation
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Simplify the control flow of this function while preserving its behavior. Return the revised code.
    context: |-
      type Entry = { id: string; enabled: boolean };
      function collectIds(entries: readonly Entry[] | undefined, limit: number): string[] {
        const ids: string[] = [];
        if (entries && entries.length > 0 && limit > 0) {
          for (const entry of entries) {
            if (entry.enabled) {
              if (ids.length < limit) {
                ids.push(entry.id);
              } else {
                break;
              }
            }
          }
        }
        return ids;
      }
      Callers pass a finite integer limit. Entries are plain data and their order matters.
    skillSource: file://code-style-like-corbin/SKILL.md
    reference: file://code-style-like-corbin/references/readability-decisions.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent names and valid code.

        - Handles missing or empty entries and a nonpositive limit with an early return.
        - Uses a straightforward loop with a fresh local result and skips disabled entries
          without wrapping the main work in a deeply nested branch.
        - Collects at most limit enabled IDs in their original order and stops when enough exist.
        - Preserves the signature and does not mutate caller-owned entries or shared state.
- description: "Code style: retain a readable reducer that mutates only its fresh accumulator"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: accept-readable-local-reducer
    caseId: code-style-like-corbin/accept-readable-local-reducer
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Does this need a readability refactor? Explain any change you recommend.
    context: |-
      type Entry = { id: string; name: string };
      function indexNames(entries: readonly Entry[]): Record<string, string> {
        return entries.reduce<Record<string, string>>((names, entry) => {
          names[entry.id] = entry.name;
          return names;
        }, {});
      }
      IDs are trusted identifiers. Last entry wins when IDs repeat. No bug is reported.
    skillSource: file://code-style-like-corbin/SKILL.md
    reference: file://code-style-like-corbin/references/readability-decisions.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent reasoning and wording.

        - Recognizes that the reducer is readable and local accumulator mutation is acceptable.
        - Recommends keeping this implementation rather than requiring a loop, repeated object
          spreads, or an elaborate pipeline solely to enforce a preferred style.
        - Distinguishes the fresh result object from caller-owned input and retains last-entry-wins behavior.
- description: "Code style: explain the invariant behind a conditional without narrating syntax"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: comment-protects-invariant
    caseId: code-style-like-corbin/comment-protects-invariant
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Add a useful comment to this less obvious logic. Return the code with the comment.
    context: |-
      type SubmissionState = { submissionAttempts: number };
      function getValidationMode(form: SubmissionState, group?: SubmissionState) {
        const attempts = group ? group.submissionAttempts : form.submissionAttempts;
        return attempts === 0 ? "submit" : "change";
      }
      A group's validation must stay in submit mode until that group is submitted,
      even if its parent form has been submitted. The two counters are independent.
    skillSource: file://code-style-like-corbin/SKILL.md
    reference: file://code-style-like-corbin/references/readability-decisions.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent comments and valid code.

        - Adds a concise comment beside the counter selection explaining that a parent's
          submissions must not switch an untouched group's validation mode.
        - Goes beyond narrating that the conditional chooses a submission counter.
        - Preserves the signature, the group-first counter selection, and the returned modes.
        - Does not invent a framework bug, upstream issue, or unrelated rationale.
- description: "Code style: name function input and promise result types while preserving generics"
  metadata:
    skill: code-style-like-corbin
    kind: behavior
    behaviorId: named-function-types
    caseId: code-style-like-corbin/named-function-types
  vars:
    skill: code-style-like-corbin
    kind: behavior
    request: Improve the readability of this function's types without changing its API or behavior. Return the revised code.
    context: |-
      async function buildReport<T>(
        { rows, format }: { readonly rows: readonly T[]; format?: (row: T) => string },
      ): Promise<{ readonly lines: readonly string[]; count: number }> {
        const lines = rows.map((row) => format ? format(row) : String(row));
        return { lines, count: lines.length };
      }
      Neither object shape has an existing named type. Each extracted type will
      only be used in this function's signature.
    skillSource: file://code-style-like-corbin/SKILL.md
    reference: file://code-style-like-corbin/references/readability-decisions.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent names and valid code.

        - Introduces meaningful named declarations for the request and report result shapes,
          using them in the destructured parameter annotation and Promise result annotation.
        - Extracts both shapes despite each named type being used only once; does not require
          a second consumer to justify naming them.
        - Preserves the relationship between rows' element type and the format callback's
          parameter, the optional format property, and all readonly modifiers.
        - Keeps the function generic, its Promise result, the count and line contents, and
          its accepted inputs and outputs without widening to any or unknown.
