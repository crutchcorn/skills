# Native Promptfoo cases. Labels are proposed and require human review.
- description: Accept a concise message preserving Thursday and the provider outage
  metadata:
    skill: write-like-corbin
    behaviorId: bluf-workplace-message
    expectedPass: true
    reviewStatus: proposed
    rationale: Short, ready-to-use message leads with the delay and retains the supplied day, cause, and
      testing context without adding facts.
  providerOutput: The release is moving to Thursday. Our payment provider had an outage during final
    testing, which delayed the release.
  vars: &a1
    request: "Message my team: the release slips to Thursday because our payment provider had an outage
      during final testing."
    context: ""
  assert:
    - type: llm-rubric
      value: file://write-like-corbin/evals/rubrics/bluf-workplace-message.txt
- description: Reject a message that changes the release day to Friday
  metadata:
    skill: write-like-corbin
    behaviorId: bluf-workplace-message
    expectedPass: false
    reviewStatus: proposed
    rationale: Matches the requested style but changes Thursday to Friday.
  providerOutput: The release is moving to Friday. Our payment provider had an outage during final
    testing, which delayed the release.
  vars: *a1
  assert:
    - type: not-llm-rubric
      value: file://write-like-corbin/evals/rubrics/bluf-workplace-message.txt
- description: Reject a message that substitutes an internal integration bug
  metadata:
    skill: write-like-corbin
    behaviorId: bluf-workplace-message
    expectedPass: false
    reviewStatus: proposed
    rationale: Preserves the day and testing context but substitutes an internal integration bug for the
      provider outage.
  providerOutput: The release is moving to Thursday. We found a bug in our payment integration during
    final testing, which delayed the release.
  vars: *a1
  assert:
    - type: not-llm-rubric
      value: file://write-like-corbin/evals/rubrics/bluf-workplace-message.txt
- description: Reject invented outage recovery and customer impact claims
  metadata:
    skill: write-like-corbin
    behaviorId: bluf-workplace-message
    expectedPass: false
    reviewStatus: proposed
    rationale: Retains the supplied facts but adds unsupported claims about recovery and customer impact.
  providerOutput: The release is moving to Thursday. Our payment provider had an outage during final
    testing. The outage is resolved and no customers were affected.
  vars: *a1
  assert:
    - type: not-llm-rubric
      value: file://write-like-corbin/evals/rubrics/bluf-workplace-message.txt
- description: Accept a direct recommendation to keep different formatters separate
  metadata:
    skill: architect-like-corbin
    behaviorId: abstract-on-concrete-requirement
    expectedPass: true
    reviewStatus: proposed
    rationale: Makes a justified direct recommendation without asking a question; respects the current
      locale differences.
  providerOutput: I would keep them separate for now. Four similar lines do not establish a shared
    contract, and the different locale handling suggests billing and invoices have different
    requirements. Extract a helper only if a current change shows they need the same formatting
    behavior, preserving each caller's locale rules.
  vars: &a2
    request: Should I abstract these two currency formatters?
    context: "`src/billing.ts` and `src/invoices.ts` each contain a four-line function that formats a
      number as currency. They differ in locale handling."
  assert:
    - type: llm-rubric
      value: file://architect-like-corbin/evals/rubrics/abstract-on-concrete-requirement.txt
- description: Accept a focused question about whether locale differences are intentional
  metadata:
    skill: architect-like-corbin
    behaviorId: abstract-on-concrete-requirement
    expectedPass: true
    reviewStatus: proposed
    rationale: A focused question is also valid when tied to a concrete shared contract and existing
      locale behavior.
  providerOutput: Do billing and invoices need to follow the same formatting rule in a current
    feature, or is the locale difference intentional? I would keep the four-line functions separate
    unless a present requirement establishes a shared contract. If we extract one, each caller must
    retain its required locale behavior.
  vars: *a2
  assert:
    - type: llm-rubric
      value: file://architect-like-corbin/evals/rubrics/abstract-on-concrete-requirement.txt
- description: Reject abstraction justified only by similar code
  metadata:
    skill: architect-like-corbin
    behaviorId: abstract-on-concrete-requirement
    expectedPass: false
    reviewStatus: proposed
    rationale: Preserves locale behavior but extracts solely because the code looks similar.
  providerOutput: Yes. Two nearly identical four-line functions are enough reason to extract a shared
    formatCurrency helper now. Add a locale parameter to preserve both callers' outputs; the
    duplicated code is all the justification we need.
  vars: *a2
  assert:
    - type: not-llm-rubric
      value: file://architect-like-corbin/evals/rubrics/abstract-on-concrete-requirement.txt
- description: Reject a shared formatter that erases required locale differences
  metadata:
    skill: architect-like-corbin
    behaviorId: abstract-on-concrete-requirement
    expectedPass: false
    reviewStatus: proposed
    rationale: Claims a concrete need without evidence and silently replaces the callers' different
      locale behavior with a single locale.
  providerOutput: The current billing and invoice consumers give us a concrete reason to share a
    helper. Use one formatCurrency function with en-US hard-coded, and replace both local functions.
    That removes the locale handling difference and makes the output consistent.
  vars: *a2
  assert:
    - type: not-llm-rubric
      value: file://architect-like-corbin/evals/rubrics/abstract-on-concrete-requirement.txt
