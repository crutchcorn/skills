- description: "Dependencies: reuse Papa Parse for CSV uploads with complex input"
  metadata:
    skill: choose-libraries-like-corbin
    kind: behavior
    behaviorId: reuse-existing-dependency
    caseId: choose-libraries-like-corbin/reuse-existing-dependency
  vars:
    skill: choose-libraries-like-corbin
    kind: behavior
    request: The web app needs to parse user-uploaded CSV files with quoted fields, embedded newlines,
      and mixed encodings. How should I handle it?
    context: The monorepo's `packages/importer` already depends on `papaparse`.
    skillSource: file://choose-libraries-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Reuses papaparse, the dependency already present in the project
        - Explains how the existing parser fits the CSV edge cases and limits code or dependency
        ownership, for example by reusing the existing parser or API instead of custom parsing or
        a second CSV library. Concrete reuse and integration decisions can establish that rationale;
        no separate maintenance paragraph or specific wording is required
        - Must NOT: Writes a handwritten CSV parser
        - Must NOT: Replaces papaparse with a different library without a concrete incompatibility
- description: "Dependencies: keep an axios migration out of a signup validation fix"
  metadata:
    skill: choose-libraries-like-corbin
    kind: behavior
    behaviorId: no-migration-during-unrelated-work
    caseId: choose-libraries-like-corbin/no-migration-during-unrelated-work
  vars:
    skill: choose-libraries-like-corbin
    kind: behavior
    request: While fixing this validation bug in the signup form, I noticed we still use axios. Should I
      switch to fetch while I'm in here?
    context: The app uses axios for all HTTP calls.
    skillSource: file://choose-libraries-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Keeps axios in place during the unrelated bug fix
        - Treats a replacement as a separate, scoped decision if it is considered at all
        - Must NOT: Migrates axios to fetch as part of the bug fix
