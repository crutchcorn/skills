name: Promptfoo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs while keeping a run for every push to main.
concurrency:
  group: promptfoo-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate eval configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:evals

  evaluate:
    name: Evaluate ${{ matrix.suite }}
    needs: validate
    # Fork and Dependabot PRs do not receive the repository API secret.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: skills
            script: eval
            providers: '^candidate$'
            report: evals/results/latest.json
          - suite: calibration
            script: eval:calibrate
            providers: '.'
            report: evals/results/calibration.json
          - suite: agents
            script: eval:agents
            providers: '.'
            report: evals/results/agents.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Codex sandbox
        if: matrix.suite == 'agents'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Run Promptfoo
        env:
          EVAL_SCRIPT: ${{ matrix.script }}
          EVAL_PROVIDERS: ${{ matrix.providers }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set the OPENAI_API_KEY repository secret to run live evals."
            exit 1
          fi
          pnpm "$EVAL_SCRIPT" --filter-providers "$EVAL_PROVIDERS" --no-progress-bar --no-table
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptfoo-${{ matrix.suite }}
          path: ${{ matrix.report }}
          if-no-files-found: warn
          retention-days: 14
