- description: "Dependencies: run TypeScript with Node and retain separate type checking"
  metadata:
    skill: choose-libraries-like-corbin
    kind: behavior
    behaviorId: prefer-native-over-runner
    caseId: choose-libraries-like-corbin/prefer-native-over-runner
  vars:
    skill: choose-libraries-like-corbin
    kind: behavior
    request: Set up `scripts/migrate.ts` to run in CI.
    context: The project runs on Node 24. `scripts/migrate.ts` is plain TypeScript with no JSX,
      decorators, or path aliases. The project already has a `typecheck` script running `tsc
      --noEmit`.
    skillSource: file://choose-libraries-like-corbin/SKILL.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Runs the script with Node's native TypeScript execution instead of adding ts-node or tsx
        - Keeps the separate type-checking step
        - Must NOT: Adds a TypeScript runner dependency
        - Must NOT: Claims that executing TypeScript natively type-checks it
