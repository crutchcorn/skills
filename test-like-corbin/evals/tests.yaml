    behaviorId: respect-existing-runner
    caseId: test-like-corbin/respect-existing-runner
  vars:
    skill: test-like-corbin
    kind: behavior
    request: Add a test for the new date parser.
    context: The repo uses Jest with React Testing Library and has about 300 existing tests.
    skillSource: file://test-like-corbin/SKILL.md
    reference: file://test-like-corbin/references/test-decisions.md
  assert:
    - type: llm-rubric
      value: |-
        Pass only if all of these requirements hold. Accept equivalent valid approaches and wording.

        - Uses the existing Jest setup
        - Must NOT: Migrates the suite to Vitest or adds a second runner
